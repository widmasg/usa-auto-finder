
name: USA Auto Finder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: palmimport-state
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout program
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout saved state
        uses: actions/checkout@v4
        with:
          ref: palmimport-state
          path: saved-state
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore state files
        run: |
          test -f saved-state/quota.json
          cp saved-state/quota.json quota.json

          if [ -f saved-state/seen.json ]; then
            cp saved-state/seen.json seen.json
          else
            echo '[]' > seen.json
          fi

      - name: Run USA Auto Finder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUCTION_FEED_URL: ${{ secrets.AUCTION_FEED_URL }}
          AUCTION_API_KEY: ${{ secrets.AUCTION_API_KEY }}
        run: python check.py

      - name: Save state
        if: always()
        working-directory: saved-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ../quota.json quota.json
          cp ../seen.json seen.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add quota.json seen.json

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update PalmImport state"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:palmimport-state
          fi
